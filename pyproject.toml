[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-dev-sandbox"
version = "0.1.0"
description = "Least-authority development sandboxes for OCI web workloads and host-native Xcode projects on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "macos-dev-sandbox contributors" }]
classifiers = [
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
dev-sandbox = "macos_dev_sandbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_dev_sandbox"]
